# Production sur le VPS (voir MISE-EN-PRODUCTION.md) :
#   docker compose -f docker-compose.prod.yml up -d --build
# Les réglages viennent du fichier .env à côté de ce fichier (modèle : .env.production.example).

name: poke-collect

# Journaux de chaque service limités à 3 × 10 Mo (sinon ils grossissent jusqu'à remplir le disque).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: poke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: poke_collect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poke -d poke_collect']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    image: poke-collect-api
    restart: unless-stopped
    logging: *logging
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://poke:${POSTGRES_PASSWORD}@postgres:5432/poke_collect
      BETTER_AUTH_URL: https://${SITE_DOMAIN:?SITE_DOMAIN manquant dans .env}
      TRUSTED_ORIGINS: https://${SITE_DOMAIN},https://${ADMIN_DOMAIN:?ADMIN_DOMAIN manquant dans .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Illustrations des Pokémon (pnpm sprites:download), partagées avec Caddy.
      - artwork:/app/apps/api/sprites/artwork
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  caddy:
    build:
      context: .
      target: caddy
    image: poke-collect-caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant dans .env}
    volumes:
      - artwork:/srv/sprites/artwork:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  artwork:
  caddy_data:
  caddy_config:
