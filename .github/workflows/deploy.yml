# Déploiement automatique sur le VPS après une CI réussie sur main (voir docs/MISE-A-JOUR.md).
# Inactif tant que la variable du dépôt DEPLOY_ENABLED ne vaut pas « true »
# (GitHub → Settings → Secrets and variables → Actions → Variables).
# Secrets nécessaires : DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
# (voir docs/INSTALLATION-SERVEUR.md, étape « Déploiement automatique »).
name: Déploiement

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Bouton « Run workflow » : redéployer à la main la dernière version de main.
  workflow_dispatch:

# Aucun droit sur le dépôt : le déploiement ne fait que se connecter au VPS.
permissions:
  contents: read

# Un seul déploiement à la fois, sans annuler celui en cours.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Après une CI réussie, seulement pour un push sur main de ce dépôt : une PR (d'un fork en
    # particulier, dont la branche peut aussi s'appeler main) ne déploie jamais. Le lancement à
    # la main ne déploie que main.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Déployer sur le VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          # Le commit exact validé par la CI (ou main pour un lancement manuel).
          VERSION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # La clé est limitée côté serveur à deploy/deploy.sh : seule la version est transmise.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$TARGET" "$VERSION"
