services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: poke
      POSTGRES_PASSWORD: poke
      POSTGRES_DB: poke_collect
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poke -d poke_collect']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
